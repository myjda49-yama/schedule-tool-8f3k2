<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>日程候補メーカー</title>
  <style>
    :root{
      --bg:#f6f7f9;
      --card:#fff;
      --text:#17191c;
      --muted:#73777f;
      --line:#e5e7eb;
      --accent:#111827;
      --accent-soft:#eef0f3;
      --danger:#b42318;
      --weekend:#f5f6f8;
      --holiday:#fff3f1;
      --shadow:0 8px 28px rgba(0,0,0,.06);
      --radius:20px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
      line-height:1.5;
    }
    button,input,textarea,select{font:inherit}
    button{touch-action:manipulation}
    .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
    header{margin:4px 0 18px}
    h1{font-size:clamp(24px,4vw,38px);margin:0 0 6px;letter-spacing:-.03em}
    .sub{margin:0;color:var(--muted);font-size:14px}
    .grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:18px;align-items:start}
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);overflow:hidden
    }
    .section{padding:20px}
    .section + .section{border-top:1px solid var(--line)}
    .section-title{font-size:14px;font-weight:700;margin:0 0 12px;color:#2a2e35}
    .monthbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:14px}
    .month-title{text-align:center;font-size:20px;font-weight:800}
    .iconbtn,.ghost,.primary,.danger,.timebtn,.quickbtn,.date-remove,.sortbtn,.movebtn{
      border:0;cursor:pointer;border-radius:12px;transition:.15s ease
    }
    .iconbtn{width:44px;height:44px;background:var(--accent-soft);font-size:23px}
    .iconbtn:disabled{opacity:.3;cursor:not-allowed}
    .iconbtn:not(:disabled):hover,.ghost:hover,.timebtn:hover,.quickbtn:hover,.sortbtn:hover,.movebtn:hover{filter:brightness(.97)}
    .week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .week div{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
    .week div:first-child,.week div:last-child{opacity:.65}
    .day{
      min-height:56px;border:0;border-radius:12px;background:transparent;cursor:pointer;
      color:var(--text);font-weight:600;position:relative;padding:6px 3px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    }
    .day:hover:not(:disabled){background:var(--accent-soft)}
    .day.other{color:#b0b4bc}
    .day.weekend{background:var(--weekend);color:#858a93}
    .day.holiday{background:var(--holiday);color:#9f3a32}
    .day.other.weekend,.day.other.holiday{opacity:.55}
    .day.past{opacity:.3;cursor:not-allowed;text-decoration:none}
    .day:disabled{pointer-events:none}
    .day-number{font-size:14px;line-height:1.1}
    .holiday-name{
      max-width:100%;font-size:8px;line-height:1.05;font-weight:700;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px
    }
    .day.today::after{
      content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
      width:4px;height:4px;border-radius:99px;background:var(--accent)
    }
    .day.selected{background:var(--accent)!important;color:#fff!important;opacity:1}
    .day.selected.today::after{background:#fff}
    .date-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .selected-label{font-size:18px;font-weight:800}
    .quick{display:flex;gap:8px;flex-wrap:wrap}
    .quickbtn,.sortbtn{padding:8px 11px;background:var(--accent-soft);font-size:13px;font-weight:700}
    .time-grid{
      display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;
      touch-action:none;user-select:none;-webkit-user-select:none
    }
    .timebtn{
      padding:10px 4px;background:#f7f8fa;border:1px solid var(--line);
      font-size:14px;user-select:none;-webkit-user-select:none
    }
    .timebtn.start{background:var(--accent);color:#fff;border-color:var(--accent)}
    .timebtn.range{background:#dfe3e9;border-color:#b9c0ca}
    .timebtn.end{box-shadow:inset 0 0 0 2px var(--accent)}
    .hint{font-size:13px;color:var(--muted);margin:10px 0 0}
    .candidate-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
    .candidate-head .section-title{margin:0}
    .candidate-list{display:flex;flex-direction:column;gap:8px}
    .candidate{
      display:flex;align-items:center;gap:8px;
      padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#fafafa
    }
    .candidate.dragging{opacity:.45}
    .drag-handle{color:#a0a5ad;font-size:18px;cursor:grab;user-select:none}
    .candidate-text{font-size:14px;font-weight:600;flex:1;min-width:0}
    .candidate-actions{display:flex;gap:4px;flex:0 0 auto}
    .movebtn,.date-remove{
      width:30px;height:30px;background:#fff;border:1px solid var(--line);
      color:var(--muted);font-size:14px;padding:0
    }
    .date-remove{font-size:18px}
    .empty{padding:18px 8px;text-align:center;color:var(--muted);font-size:14px}
    label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
    input[type="text"],textarea{
      width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);
      padding:11px 12px;outline:none
    }
    input[type="text"]:focus,textarea:focus{border-color:#9aa0aa;box-shadow:0 0 0 3px #f0f1f3}
    textarea{min-height:250px;resize:vertical;line-height:1.8}
    .row{display:flex;gap:10px;margin-top:12px}
    .primary,.ghost,.danger{padding:12px 14px;font-weight:800;flex:1}
    .primary{background:var(--accent);color:#fff}
    .ghost{background:var(--accent-soft);color:var(--text)}
    .danger{background:#fff0ee;color:var(--danger)}
    .toast{
      position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
      background:#111827;color:#fff;padding:10px 14px;border-radius:99px;
      opacity:0;pointer-events:none;transition:.2s ease;font-size:14px;box-shadow:var(--shadow);z-index:20
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .select-wrap select{
      width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff
    }
    footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
    @media (max-width:820px){
      .grid{grid-template-columns:1fr}
      .output-card{position:static}
      .time-grid{grid-template-columns:repeat(4,1fr)}
    }
    @media (min-width:821px){.output-card{position:sticky;top:16px}}
    @media (max-width:430px){
      .wrap{padding:16px 10px 36px}.section{padding:16px}
      .day{min-height:52px}.holiday-name{font-size:7px}
      .time-grid{grid-template-columns:repeat(3,1fr)}
      .row{flex-direction:column}
      .movebtn{width:28px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>日程候補メーカー</h1>
      <p class="sub">日付と時間を選ぶだけで、日程調整メッセージを作成できます。</p>
    </header>

    <div class="grid">
      <div class="card">
        <section class="section">
          <div class="monthbar">
            <button class="iconbtn" id="prevMonth" aria-label="前の月">‹</button>
            <div class="month-title" id="monthTitle"></div>
            <button class="iconbtn" id="nextMonth" aria-label="次の月">›</button>
          </div>
          <div class="week">
            <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
          </div>
          <div class="days" id="calendar"></div>
        </section>

        <section class="section">
          <div class="date-head">
            <div>
              <p class="section-title">時間を選択</p>
              <div class="selected-label" id="selectedDateLabel">日付を選んでください</div>
            </div>
            <div class="quick">
              <button class="quickbtn" data-duration="30">+30分</button>
              <button class="quickbtn" data-duration="60">+60分</button>
              <button class="quickbtn" data-duration="90">+90分</button>
            </div>
          </div>
          <div class="time-grid" id="timeGrid"></div>
          <p class="hint">時間をドラッグして範囲選択できます。タップ2回で開始・終了を指定することもできます。</p>
        </section>

        <section class="section">
          <div class="candidate-head">
            <p class="section-title">候補日時</p>
            <button class="sortbtn" id="sortBtn">日付順に並べ替え</button>
          </div>
          <div class="candidate-list" id="candidateList"></div>
          <p class="hint">PCは行をドラッグ、スマホは ↑ ↓ で順番を変更できます。</p>
        </section>
      </div>

      <div class="card output-card">
        <section class="section">
          <p class="section-title">文章設定</p>
          <label for="intro">冒頭文</label>
          <input id="intro" type="text" value="" placeholder="必要なら冒頭文を入力" />
          <div class="settings" style="margin-top:10px">
            <div class="select-wrap">
              <label for="format">日付形式</label>
              <select id="format">
                <option value="jp">8月18日(火)</option>
                <option value="slash">8/18(火)</option>
                <option value="full">2026年8月18日(火)</option>
              </select>
            </div>
            <div class="select-wrap">
              <label for="bullet">行頭</label>
              <select id="bullet">
                <option value="- " selected>-</option>
                <option value="">なし</option>
                <option value="・">・</option>
                <option value="①">連番</option>
              </select>
            </div>
          </div>
        </section>

        <section class="section">
          <p class="section-title">生成結果</p>
          <textarea id="output" readonly placeholder="日付を選ぶと、ここに候補日時が表示されます。"></textarea>
          <div class="row">
            <button class="primary" id="copyBtn">コピーする</button>
            <button class="ghost" id="resetBtn">リセット</button>
          </div>
        </section>
      </div>
    </div>

    <footer>ブラウザ内だけで動作します。祝日は現行の日本の祝日ルールをもとに自動表示します。</footer>
  </main>

  <div class="toast" id="toast">コピーしました</div>

<script>
(() => {
  const weekdays = ["日","月","火","水","木","金","土"];
  const now = new Date();
  now.setHours(0,0,0,0);
  const currentMonth = new Date(now.getFullYear(), now.getMonth(), 1);

  let viewDate = new Date(currentMonth);
  let selectedDate = null;
  let startMinutes = null;
  let candidates = [];

  let dragSelecting = false;
  let dragStart = null;
  let dragEnd = null;
  let draggedCandidateId = null;

  const $ = id => document.getElementById(id);
  const calendar = $("calendar");
  const monthTitle = $("monthTitle");
  const selectedDateLabel = $("selectedDateLabel");
  const timeGrid = $("timeGrid");
  const candidateList = $("candidateList");
  const output = $("output");
  const intro = $("intro");
  const formatSelect = $("format");
  const bulletSelect = $("bullet");
  const toast = $("toast");

  const pad = n => String(n).padStart(2,"0");
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const sameDay = (a,b) => a && b && keyOf(a) === keyOf(b);
  const toTime = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;

  function dateText(date, mode = formatSelect.value){
    const y = date.getFullYear(), m = date.getMonth()+1, d = date.getDate(), w = weekdays[date.getDay()];
    if(mode === "slash") return `${m}/${d}(${w})`;
    if(mode === "full") return `${y}年${m}月${d}日(${w})`;
    return `${m}月${d}日(${w})`;
  }

  function nthWeekday(year, monthIndex, weekday, nth){
    const first = new Date(year, monthIndex, 1);
    const offset = (weekday - first.getDay() + 7) % 7;
    return new Date(year, monthIndex, 1 + offset + (nth - 1) * 7);
  }

  function vernalEquinoxDay(year){
    return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
  }

  function autumnEquinoxDay(year){
    return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
  }

  function baseJapaneseHolidays(year){
    const h = new Map();
    const add = (month, day, name) => h.set(`${year}-${pad(month)}-${pad(day)}`, name);
    const addDate = (date, name) => h.set(keyOf(date), name);

    add(1,1,"元日");
    addDate(nthWeekday(year,0,1,2),"成人の日");
    add(2,11,"建国記念の日");
    add(2,23,"天皇誕生日");
    add(3,vernalEquinoxDay(year),"春分の日");
    add(4,29,"昭和の日");
    add(5,3,"憲法記念日");
    add(5,4,"みどりの日");
    add(5,5,"こどもの日");
    addDate(nthWeekday(year,6,1,3),"海の日");
    add(8,11,"山の日");
    addDate(nthWeekday(year,8,1,3),"敬老の日");
    add(9,autumnEquinoxDay(year),"秋分の日");
    addDate(nthWeekday(year,9,1,2),"スポーツの日");
    add(11,3,"文化の日");
    add(11,23,"勤労感謝の日");
    return h;
  }

  const holidayCache = new Map();
  function japaneseHolidays(year){
    if(holidayCache.has(year)) return holidayCache.get(year);

    const h = baseJapaneseHolidays(year);

    // 国民の休日：祝日に挟まれた日
    let changed = true;
    while(changed){
      changed = false;
      const start = new Date(year,0,2);
      const end = new Date(year,11,30);
      for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
        const k = keyOf(d);
        if(h.has(k)) continue;
        const prev = new Date(d); prev.setDate(prev.getDate()-1);
        const next = new Date(d); next.setDate(next.getDate()+1);
        if(h.has(keyOf(prev)) && h.has(keyOf(next))){
          h.set(k,"国民の休日");
          changed = true;
        }
      }
    }

    // 振替休日：日曜の祝日の直後にある最初の非祝日
    const originals = [...h.entries()];
    for(const [k,name] of originals){
      const [y,m,d] = k.split("-").map(Number);
      const date = new Date(y,m-1,d);
      if(date.getDay() !== 0) continue;
      const sub = new Date(date);
      do { sub.setDate(sub.getDate()+1); } while(h.has(keyOf(sub)));
      if(sub.getFullYear() === year) h.set(keyOf(sub),"振替休日");
    }

    holidayCache.set(year,h);
    return h;
  }

  function holidayName(date){
    return japaneseHolidays(date.getFullYear()).get(keyOf(date)) || "";
  }

  function renderCalendar(){
    monthTitle.textContent = `${viewDate.getFullYear()}年 ${viewDate.getMonth()+1}月`;
    calendar.innerHTML = "";

    $("prevMonth").disabled = viewDate <= currentMonth;

    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const first = new Date(year, month, 1);
    const gridStart = new Date(year, month, 1 - first.getDay());

    for(let i=0;i<42;i++){
      const d = new Date(gridStart);
      d.setDate(gridStart.getDate()+i);
      d.setHours(0,0,0,0);

      const btn = document.createElement("button");
      btn.className = "day";

      const num = document.createElement("span");
      num.className = "day-number";
      num.textContent = d.getDate();
      btn.appendChild(num);

      const holiday = holidayName(d);
      if(holiday){
        const label = document.createElement("span");
        label.className = "holiday-name";
        label.textContent = holiday;
        label.title = holiday;
        btn.appendChild(label);
        btn.classList.add("holiday");
      }

      if(d.getDay() === 0 || d.getDay() === 6) btn.classList.add("weekend");
      if(d.getMonth() !== month) btn.classList.add("other");
      if(d < now){
        btn.classList.add("past");
        btn.disabled = true;
        btn.setAttribute("aria-disabled","true");
      }
      if(sameDay(d, now)) btn.classList.add("today");
      if(sameDay(d, selectedDate)) btn.classList.add("selected");

      btn.addEventListener("click", () => {
        selectedDate = new Date(d);
        viewDate = new Date(d.getFullYear(), d.getMonth(), 1);
        startMinutes = null;
        dragStart = dragEnd = null;
        renderCalendar();
        renderTimes();
      });

      calendar.appendChild(btn);
    }
  }

  function renderTimes(){
    if(!selectedDate){
      selectedDateLabel.textContent = "日付を選んでください";
      timeGrid.innerHTML = "";
      return;
    }

    const holiday = holidayName(selectedDate);
    selectedDateLabel.textContent = `${dateText(selectedDate)}${holiday ? ` · ${holiday}` : ""}`;
    timeGrid.innerHTML = "";

    const start = 8 * 60;
    const end = 21 * 60;

    for(let m=start; m<=end; m+=30){
      const btn = document.createElement("button");
      btn.className = "timebtn";
      btn.type = "button";
      btn.dataset.minute = String(m);
      btn.textContent = toTime(m);
      timeGrid.appendChild(btn);
    }
    updateTimeHighlights();
  }

  function updateTimeHighlights(){
    const buttons = timeGrid.querySelectorAll(".timebtn");
    let a = null, b = null;

    if(dragSelecting && dragStart !== null && dragEnd !== null){
      a = Math.min(dragStart, dragEnd);
      b = Math.max(dragStart, dragEnd);
    } else if(startMinutes !== null){
      a = startMinutes;
      b = startMinutes;
    }

    buttons.forEach(btn => {
      const m = Number(btn.dataset.minute);
      btn.classList.remove("start","range","end");

      if(a === null) return;
      if(m === a) btn.classList.add("start");
      if(b > a && m > a && m < b) btn.classList.add("range");
      if(b > a && m === b) btn.classList.add("range","end");
    });
  }

  function minuteAtPoint(x,y){
    const el = document.elementFromPoint(x,y);
    const btn = el && el.closest ? el.closest(".timebtn") : null;
    if(!btn || !timeGrid.contains(btn)) return null;
    return Number(btn.dataset.minute);
  }

  timeGrid.addEventListener("pointerdown", e => {
    const btn = e.target.closest(".timebtn");
    if(!btn || !selectedDate) return;
    e.preventDefault();
    dragSelecting = true;
    dragStart = Number(btn.dataset.minute);
    dragEnd = dragStart;
    updateTimeHighlights();
    try{ timeGrid.setPointerCapture(e.pointerId); }catch{}
  });

  timeGrid.addEventListener("pointermove", e => {
    if(!dragSelecting) return;
    e.preventDefault();
    const m = minuteAtPoint(e.clientX,e.clientY);
    if(m !== null && m !== dragEnd){
      dragEnd = m;
      updateTimeHighlights();
    }
  });

  function finishTimePointer(e){
    if(!dragSelecting) return;
    e.preventDefault();

    const a = Math.min(dragStart, dragEnd);
    const b = Math.max(dragStart, dragEnd);
    dragSelecting = false;

    if(a !== b){
      addCandidate(selectedDate, a, b);
      startMinutes = null;
    }else{
      if(startMinutes === null){
        startMinutes = a;
      }else if(a > startMinutes){
        addCandidate(selectedDate, startMinutes, a);
        startMinutes = null;
      }else{
        startMinutes = a;
      }
    }

    dragStart = dragEnd = null;
    updateTimeHighlights();
  }

  timeGrid.addEventListener("pointerup", finishTimePointer);
  timeGrid.addEventListener("pointercancel", e => {
    dragSelecting = false;
    dragStart = dragEnd = null;
    updateTimeHighlights();
  });

  function addCandidate(date, start, end){
    if(end <= start) return;
    const item = {
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()),
      date:new Date(date), start, end
    };
    const duplicate = candidates.some(c =>
      keyOf(c.date)===keyOf(item.date) && c.start===start && c.end===end
    );
    if(!duplicate){
      candidates.push(item);
      candidates.sort((a,b) => a.date-b.date || a.start-b.start || a.end-b.end);
    }else{
      showToast("同じ候補がすでにあります");
    }
    renderCandidates();
    renderOutput();
  }

  function moveCandidate(id, direction){
    const index = candidates.findIndex(c => c.id === id);
    if(index < 0) return;
    const next = index + direction;
    if(next < 0 || next >= candidates.length) return;
    [candidates[index], candidates[next]] = [candidates[next], candidates[index]];
    renderCandidates();
    renderOutput();
  }

  function renderCandidates(){
    candidateList.innerHTML = "";
    if(!candidates.length){
      candidateList.innerHTML = '<div class="empty">まだ候補日時がありません</div>';
      return;
    }

    candidates.forEach((c,index) => {
      const row = document.createElement("div");
      row.className = "candidate";
      row.draggable = true;
      row.dataset.id = c.id;

      const handle = document.createElement("span");
      handle.className = "drag-handle";
      handle.textContent = "☰";
      handle.title = "ドラッグして並べ替え";

      const text = document.createElement("div");
      text.className = "candidate-text";
      text.textContent = `${dateText(c.date)} ${toTime(c.start)}-${toTime(c.end)}`;

      const actions = document.createElement("div");
      actions.className = "candidate-actions";

      const up = document.createElement("button");
      up.className = "movebtn";
      up.type = "button";
      up.textContent = "↑";
      up.title = "上へ";
      up.disabled = index === 0;
      up.addEventListener("click", () => moveCandidate(c.id,-1));

      const down = document.createElement("button");
      down.className = "movebtn";
      down.type = "button";
      down.textContent = "↓";
      down.title = "下へ";
      down.disabled = index === candidates.length-1;
      down.addEventListener("click", () => moveCandidate(c.id,1));

      const remove = document.createElement("button");
      remove.className = "date-remove";
      remove.type = "button";
      remove.setAttribute("aria-label","削除");
      remove.textContent = "×";
      remove.addEventListener("click", () => {
        candidates = candidates.filter(x => x.id !== c.id);
        renderCandidates();
        renderOutput();
      });

      row.addEventListener("dragstart", e => {
        draggedCandidateId = c.id;
        row.classList.add("dragging");
        if(e.dataTransfer){
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", c.id);
        }
      });
      row.addEventListener("dragend", () => {
        draggedCandidateId = null;
        row.classList.remove("dragging");
      });
      row.addEventListener("dragover", e => {
        e.preventDefault();
        if(e.dataTransfer) e.dataTransfer.dropEffect = "move";
      });
      row.addEventListener("drop", e => {
        e.preventDefault();
        const fromId = draggedCandidateId || (e.dataTransfer && e.dataTransfer.getData("text/plain"));
        const toId = c.id;
        if(!fromId || fromId === toId) return;

        const from = candidates.findIndex(x => x.id === fromId);
        const to = candidates.findIndex(x => x.id === toId);
        if(from < 0 || to < 0) return;

        const [moved] = candidates.splice(from,1);
        candidates.splice(to,0,moved);
        renderCandidates();
        renderOutput();
      });

      actions.append(up,down,remove);
      row.append(handle,text,actions);
      candidateList.appendChild(row);
    });
  }

  function renderOutput(){
    const introText = intro.value.trim();
    const bullet = bulletSelect.value;
    const lines = candidates.map((c,i) => {
      let prefix = bullet;
      if(bullet === "①"){
        const nums = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩"];
        prefix = nums[i] || `${i+1}. `;
      }
      return `${prefix}${dateText(c.date)} ${toTime(c.start)}-${toTime(c.end)}`;
    });
    output.value = [introText, lines.join("\n")].filter(Boolean).join("\n");
  }

  function addDuration(minutes){
    if(!selectedDate || startMinutes === null){
      showToast("先に日付と開始時刻を選んでください");
      return;
    }
    const end = startMinutes + minutes;
    if(end > 24*60){
      showToast("終了時刻が日付をまたぎます");
      return;
    }
    addCandidate(selectedDate,startMinutes,end);
    startMinutes = null;
    updateTimeHighlights();
  }

  function showToast(message){
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(()=>toast.classList.remove("show"),1500);
  }

  $("prevMonth").addEventListener("click", () => {
    const prev = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1);
    if(prev < currentMonth) return;
    viewDate = prev;
    renderCalendar();
  });

  $("nextMonth").addEventListener("click", () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1);
    renderCalendar();
  });

  document.querySelectorAll(".quickbtn").forEach(btn => {
    btn.addEventListener("click", () => addDuration(Number(btn.dataset.duration)));
  });

  $("sortBtn").addEventListener("click", () => {
    candidates.sort((a,b) => a.date-b.date || a.start-b.start || a.end-b.end);
    renderCandidates();
    renderOutput();
    showToast("日付順に並べ替えました");
  });

  intro.addEventListener("input", renderOutput);
  formatSelect.addEventListener("change", () => {
    renderCandidates(); renderTimes(); renderOutput();
  });
  bulletSelect.addEventListener("change", renderOutput);

  $("copyBtn").addEventListener("click", async () => {
    if(!output.value.trim()){
      showToast("コピーする内容がありません");
      return;
    }
    try{
      await navigator.clipboard.writeText(output.value);
      showToast("コピーしました");
    }catch{
      output.focus();
      output.select();
      document.execCommand("copy");
      showToast("コピーしました");
    }
  });

  $("resetBtn").addEventListener("click", () => {
    candidates = [];
    startMinutes = null;
    selectedDate = null;
    dragSelecting = false;
    dragStart = dragEnd = null;
    viewDate = new Date(currentMonth);
    renderCalendar();
    renderTimes();
    renderCandidates();
    renderOutput();
    showToast("リセットしました");
  });

  renderCalendar();
  renderTimes();
  renderCandidates();
  renderOutput();
})();
</script>
</body>
</html>
